<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" crossorigin="anonymous" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" crossorigin="anonymous" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Time to play tic tac toe.</h1>
    <!-- Game board -->
    <div id="game-board">
      <div class="top-row">
        <div class="cell" data-cell-index="0"></div>
        <div class="cell" data-cell-index="1"></div>
        <div class="cell" data-cell-index="2"></div>
      </div>
      <div class="middle-row">
        <div class="cell" data-cell-index="3"></div>
        <div class="cell" data-cell-index="4"></div>
        <div class="cell" data-cell-index="5"></div>
      </div>
      <div class="bottom-row">
        <div class="cell" data-cell-index="6"></div>
        <div class="cell" data-cell-index="7"></div>
        <div class="cell" data-cell-index="8"></div>
      </div>
    </div>
    <div>
      <p id="player-1">Player 1</p>
      <p id="player-2">Player 2</p>
    </div>
    <div>
      <!-- <p id="player-status">Player 1's turn</p> -->
      <button id="start-button">Start Game</button>
      <button id="reset-button">Reset Game</button>
    </div>
    <script type="py" config="./pyscript.json" src="./main.py"></script>
  </body>
</html>
